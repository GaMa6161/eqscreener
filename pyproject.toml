[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-eq-scanner"
version = "0.1.0"
description = "Nifty 500 market activity, momentum stocks, option strike ideas, swing screener, and local dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "requests>=2.31",
  "feedparser>=6.0",
  "Jinja2>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
extras = ["yfinance>=0.2.40"]

[project.scripts]
nifty-scanner = "nifty_scanner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
