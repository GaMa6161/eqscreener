name: EOD Swing Screener

# OPTIONAL cloud automation. The primary way to use this project is to run it
# manually on your PC (see README / scripts/run_local.sh). Enable this workflow
# only if you ALSO want scheduled email digests from the cloud.
# Runs after the NSE bhavcopy is published. GitHub cron is UTC; 13:37 UTC = 19:07 IST.
#
# Odd minute on purpose: GitHub's scheduler is most contended at :00 and :30.
# Nudged later rather than earlier so a late bhavcopy is still published by the
# time this runs; unlike the pre-market brief, this one has no hard deadline.
on:
  schedule:
    - cron: "37 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write        # commit the updated Parquet history back to the repo

concurrency:
  group: eod
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_SELF_COPY: ${{ secrets.EMAIL_SELF_COPY }}
      ACCOUNT_CAPITAL: ${{ secrets.ACCOUNT_CAPITAL }}
      RISK_PCT_PER_TRADE: ${{ secrets.RISK_PCT_PER_TRADE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with yfinance for index option spots)
        run: pip install -e '.[extras]'

      - name: Update universe + history (idempotent; full backfill on first run)
        run: |
          nifty-scanner build-universe
          nifty-scanner backfill

      - name: Run EOD screener (email digest)
        run: nifty-scanner run-eod

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history data/universe
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: EOD history update $(date -u +%F)"
            git push
          fi
