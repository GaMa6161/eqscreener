name: Morning Digest

# Sends BOTH the swing screener and the pre-market brief in a single run, so the
# two emails always arrive together. Two separate schedules set to the same
# minute would not: GitHub queues each one independently and they can land hours
# apart.
#
# GitHub cron is UTC; 01:07 UTC = 06:37 IST. Deliberately early and on an odd
# minute - the scheduler is best-effort and most contended at :00 and :30, and
# the brief is useless after the 09:15 IST open, so this leaves ~2.5h of slack.
#
# Note: the screener runs pre-open, so it scores the PREVIOUS session's close.
# Monday morning screens Friday's close; Monday's own close is screened Tuesday.
on:
  schedule:
    - cron: "7 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write        # commit the updated Parquet history back to the repo

concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_SELF_COPY: ${{ secrets.EMAIL_SELF_COPY }}
      ACCOUNT_CAPITAL: ${{ secrets.ACCOUNT_CAPITAL }}
      RISK_PCT_PER_TRADE: ${{ secrets.RISK_PCT_PER_TRADE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with yfinance for overnight cues)
        run: pip install -e '.[extras]'

      - name: Update universe + history (idempotent; full backfill on first run)
        run: |
          nifty-scanner build-universe
          nifty-scanner backfill

      - name: Run EOD screener (email digest)
        run: nifty-scanner run-eod

      # The two emails are independent products: a screener failure (e.g. an NSE
      # fetch blip) should not also cost you the morning brief.
      - name: Run pre-market brief (news + cues, email)
        if: ${{ !cancelled() }}
        run: nifty-scanner run-news

      - name: Commit updated history
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history data/universe
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: morning history update $(date -u +%F)"
            git push
          fi
