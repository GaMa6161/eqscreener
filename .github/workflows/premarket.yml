name: Pre-Market Brief

# OPTIONAL cloud automation (primary usage is manual on your PC - see README).
# Morning consolidated global news + overnight cues (useful for intraday).
# MANUAL ONLY. The daily schedule lives in morning.yml, which sends this brief
# and the swing screener together in one run. Kept here so the brief can be
# re-sent on its own without also re-running the screener.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_SELF_COPY: ${{ secrets.EMAIL_SELF_COPY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with yfinance for overnight cues)
        run: pip install -e '.[extras]'

      - name: Run pre-market brief (news + cues, email, deploy)
        run: nifty-scanner run-news
