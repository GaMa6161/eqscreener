name: Pre-Market Brief

# OPTIONAL cloud automation (primary usage is manual on your PC - see README).
# Morning consolidated global news + overnight cues (useful for intraday).
# GitHub cron is UTC; 01:07 UTC = 06:37 IST.
#
# Deliberately early and on an odd minute. GitHub's scheduler is best-effort:
# runs queue late during high load (worst at :00 and :30) and are sometimes
# dropped entirely. The brief is useless after the 09:15 IST open, so this
# leaves ~2.5h of slack rather than aiming at 08:00 and hoping.
on:
  schedule:
    - cron: "7 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_SELF_COPY: ${{ secrets.EMAIL_SELF_COPY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with yfinance for overnight cues)
        run: pip install -e '.[extras]'

      - name: Run pre-market brief (news + cues, email, deploy)
        run: nifty-scanner run-news
